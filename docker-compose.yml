services:
  app:
    build:
      context: .
    image: lineage-analyzer:latest
    container_name: lineage_analyzer_app
    restart: unless-stopped
    environment:
      LINEAGE_DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      LINEAGE_ADMIN_USERNAME: ${LINEAGE_ADMIN_USERNAME:-admin}
      LINEAGE_ADMIN_PASSWORD: ${LINEAGE_ADMIN_PASSWORD:-}
      LINEAGE_WAREHOUSE_ENV_FILE: /app/secrets/warehouse.env
    ports:
      - "${LINEAGE_APP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_secrets:/app/secrets
    networks:
      - default
      - warehouse_sync
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: lineage_metadata_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  app_secrets:

networks:
  warehouse_sync:
    external: true
    name: ${WAREHOUSE_DOCKER_NETWORK:-diploma_test_db_default}
